version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: equibalance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: equibalance
      POSTGRES_USER: equibalance
      POSTGRES_PASSWORD: equibalance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equibalance"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: equibalance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: equibalance-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/equibalance
      SPRING_DATASOURCE_USERNAME: equibalance
      SPRING_DATASOURCE_PASSWORD: equibalance
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-to-a-long-random-secret}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-demo}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: equibalance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:80"

volumes:
  pgdata:
  redisdata:
